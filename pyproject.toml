[project]
name = "eight-manager"
version = "0.1.0"
description = "Telegram bot per gestire abbonamenti, rinnovi e scadenze"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.5",
    "python-telegram-bot[job-queue]>=22.8,<23",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "freezegun>=1.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
